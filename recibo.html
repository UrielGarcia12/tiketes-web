<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Ticket — Tiketes</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#07070F">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#07070F}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:60px;-webkit-font-smoothing:antialiased;
}

.topbar{
  width:100%;padding:20px 20px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:24px;
}
.topbar-brand{font-size:13px;font-weight:700;letter-spacing:.10em;color:rgba(255,255,255,.38);text-transform:uppercase;}
.topbar-tag{font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:.04em;transition:all .3s;background:rgba(255,255,255,.08);color:rgba(255,255,255,.4);}
.topbar-tag.ready{background:rgba(34,197,94,.15);color:#4ADE80;}
.topbar-tag.error{background:rgba(239,68,68,.14);color:#F87171;}

.status{display:flex;flex-direction:column;align-items:center;padding:0 24px 24px;gap:12px;opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s;}
.status.show{opacity:1;transform:translateY(0)}
.status-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#22C55E,#16A34A);box-shadow:0 14px 36px rgba(34,197,94,.38);}
.status-icon svg{width:30px;height:30px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.status-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.04em;text-align:center;}
.status-sub{font-size:13px;color:rgba(255,255,255,.40);text-align:center;line-height:1.55;max-width:280px;}

.paper-outer{width:calc(100% - 32px);max-width:380px;margin:0 16px;opacity:0;transform:translateY(16px);transition:opacity .5s .15s,transform .5s .15s;}
.paper-outer.show{opacity:1;transform:translateY(0)}
.paper{
  background:#fff;border-radius:22px;
  padding:24px 20px 20px;color:#0F0F28;position:relative;overflow:hidden;
  box-shadow:0 28px 72px rgba(0,0,0,.48);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
.paper .tlogo{display:block;margin:0 auto 14px;width:150px;max-width:55%;}
.paper .headrow{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;}
.paper .storebox{flex:1;background:#F4F4FA;border:1px solid #ECECF4;border-radius:16px;padding:12px 14px;text-align:center;min-width:0;}
.paper .store{font-size:15px;font-weight:800;letter-spacing:-.01em;margin-bottom:3px;}
.paper .slogan{font-size:11px;color:#8a8a9c;margin-bottom:3px;font-style:italic;}
.paper .addr{font-size:11px;color:#8a8a9c;line-height:1.45;}
.paper .folio{text-align:right;padding-top:4px;min-width:52px;}
.paper .folio .fl{font-size:11px;color:#9a9aac;}
.paper .folio .fn{font-size:14px;font-weight:800;color:#0F0F28;}
.paper .cust{text-align:center;font-size:12px;margin-bottom:10px;font-weight:700;color:#4524D6;}
.paper .sep{border-top:1.5px dashed #E3E3EC;margin:14px 0;}
.paper .thinrule{height:1px;background:#EDEDF3;margin:14px 0;}
.paper .items{margin:2px 0;}
.paper .item{display:flex;align-items:baseline;gap:10px;padding:5px 0;}
.paper .item .in{flex:1;font-size:14px;font-weight:600;color:#0F0F28;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.paper .item .iq{font-size:12px;color:#9a9aac;white-space:nowrap;}
.paper .item .ip{font-size:14px;font-weight:700;color:#0F0F28;white-space:nowrap;min-width:62px;text-align:right;}
.paper .subrow{display:flex;justify-content:space-between;font-size:13px;color:#6b6b80;padding:3px 0;}
.paper .subrow .sa{font-weight:600;color:#0F0F28;}
.paper .totalrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px;}
.paper .totalrow .tl{font-size:19px;font-weight:800;color:#0F0F28;}
.paper .totalrow .ta{font-size:22px;font-weight:800;color:#0F0F28;letter-spacing:-.02em;}
.paper .paytag{text-align:center;font-size:12px;margin:12px 0 2px;padding:8px 0;border:1px solid #E3E3EC;border-radius:11px;font-weight:700;letter-spacing:.06em;color:#4524D6;}
.paper .paidrow{display:flex;justify-content:space-between;font-size:13px;color:#6b6b80;padding:6px 2px;}
.paper .paidrow .pa{font-weight:600;color:#0F0F28;}
.paper .changebox{background:#E7F9EE;border-radius:14px;padding:14px 16px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;}
.paper .changebox .cl{font-size:16px;font-weight:800;color:#137333;letter-spacing:.02em;}
.paper .changebox .ca{font-size:23px;font-weight:800;color:#0E7A32;letter-spacing:-.02em;}
.paper .fiado{border:2px solid #0F0F28;border-radius:12px;padding:12px;margin-top:12px;text-align:center;}
.paper .fiado-title{font-size:14px;font-weight:800;letter-spacing:1px;}
.paper .fiado-sub{font-size:11px;margin-top:4px;color:#6b6b80;}
.paper .foot{text-align:center;font-size:11.5px;margin-top:12px;color:#9a9aac;line-height:1.5;}
.paper .thanks{text-align:center;font-size:14px;font-weight:700;margin-top:6px;color:#0F0F28;}
.paper .social{text-align:center;font-size:11.5px;color:#9a9aac;margin-top:4px;font-weight:600;}
.paper .legal{text-align:center;font-size:10px;color:#a0a0b0;margin-top:10px;padding-top:8px;border-top:1px dashed #E3E3EC;line-height:1.4;}
.paper .brand{text-align:center;font-size:10px;color:#b0b0be;margin-top:8px;letter-spacing:1.5px;font-weight:600;}
.paper .wmwrap{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:0;}
.paper .wmline{position:absolute;left:-30px;transform:rotate(-20deg);font-size:15px;font-weight:800;color:rgba(15,15,40,0.045);white-space:nowrap;letter-spacing:3px;}
.paper .content{position:relative;z-index:1;}

.btn-dl{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 32px);max-width:380px;margin:18px 16px 0;padding:16px;background:#fff;border:0;border-radius:16px;cursor:pointer;font-size:15px;font-weight:700;color:#0F0F28;letter-spacing:-.02em;box-shadow:0 8px 28px rgba(0,0,0,.28);-webkit-tap-highlight-color:transparent;opacity:0;transform:translateY(12px);transition:opacity .4s .3s,transform .4s .3s;}
.btn-dl.show{opacity:1;transform:translateY(0)}
.btn-dl:active{opacity:.8;transform:scale(.97)}

.err{color:rgba(255,255,255,.44);text-align:center;padding:64px 32px;max-width:320px;}
.err h2{font-size:20px;color:#fff;margin-bottom:8px;font-weight:700}

.recibo-foot{margin:26px 16px 4px;text-align:center;opacity:0;animation:footIn .5s .5s forwards;}
@keyframes footIn{to{opacity:1}}
.recibo-brand{font-size:12px;color:rgba(255,255,255,.34);font-weight:600;letter-spacing:.02em;}
.recibo-brand strong{color:rgba(255,255,255,.64);}
.recibo-links{margin-top:9px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:9px;}
.recibo-links a{color:#A88EFF;text-decoration:none;}
.recibo-links a:active{opacity:.7;}
.recibo-links .dot{color:rgba(255,255,255,.25);}
/* Modo preview (editor de la app): solo la tarjeta del recibo. */
body.preview .topbar,body.preview .status,body.preview .btn-dl,body.preview .recibo-foot{display:none!important;}
body.preview,html:has(body.preview){padding-top:18px;padding-bottom:24px;background:#EEF0F6!important;}
/* Widget de calificacion (reseña del cliente) */
.rate{width:calc(100% - 32px);max-width:380px;margin:20px auto 0;background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center;opacity:0;transform:translateY(12px);transition:opacity .5s .2s,transform .5s .2s;}
.rate.show{opacity:1;transform:translateY(0)}
.rate h3{font-size:16px;font-weight:800;color:#0F0F28;margin-bottom:4px;letter-spacing:-.02em}
.rate p{font-size:12.5px;color:#6b6b80;margin-bottom:14px}
.stars{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.star{width:38px;height:38px;cursor:pointer;color:#D9D9E3;transition:transform .1s,color .15s;-webkit-tap-highlight-color:transparent}
.star:active{transform:scale(.85)}
.star.on{color:#F5C518}
.star svg{width:100%;height:100%;fill:currentColor;display:block}
.rate textarea{width:100%;border:1px solid #E3E3EC;border-radius:12px;padding:11px 12px;font-family:inherit;font-size:13px;color:#0F0F28;resize:none;height:60px;margin-bottom:12px;outline:none}
.rate textarea:focus{border-color:#8B70FF}
.rate-send{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(90deg,#8B70FF,#4524D6);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;opacity:.45;pointer-events:none;transition:opacity .2s}
.rate-send.ready{opacity:1;pointer-events:auto}
.rate-send:active{transform:scale(.98)}
.rate-done{padding:10px 0 2px;font-size:15px;font-weight:700;color:#137333}
.rate-done span{display:block;font-size:12.5px;color:#6b6b80;font-weight:500;margin-top:4px}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-brand">Tiketes</span>
  <span class="topbar-tag" id="tag">Cargando…</span>
</div>

<div class="status" id="statusEl">
  <div class="status-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
  <div class="status-title">¡Ticket guardado!</div>
  <div class="status-sub">Tu comprobante se guardó en tu galería. Puedes compartirlo cuando quieras.</div>
</div>

<div id="paperWrap"></div>

<div id="rateWrap"></div>

<button class="btn-dl" id="btnDl" onclick="downloadNow()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  <span id="btnLabel">Guardar ticket</span>
</button>

<footer class="recibo-foot">
  <div class="recibo-brand">Recibo digital vía <strong>Tiketes</strong></div>
  <div class="recibo-links">
    <a href="https://tiketes.com.mx/terms.html" target="_blank" rel="noopener">Términos</a>
    <span class="dot">·</span>
    <a href="https://tiketes.com.mx/privacy.html" target="_blank" rel="noopener">Privacidad</a>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return '$'+Number(n||0).toFixed(2);}
function $(id){return document.getElementById(id);}

var params=new URLSearchParams(location.search);
// Modo "preview" (usado por el editor de la app): muestra solo la tarjeta del
// recibo, sin barra superior, estado ni botón de descarga.
if(params.has('preview')){document.body.classList.add('preview');}
var raw=params.get('d');
var d=null;
try{d=JSON.parse(raw||'');}catch(e){}

var tag=$('tag'),statusEl=$('statusEl'),paperWrap=$('paperWrap'),btnDl=$('btnDl');

if(!d||d.T==null){
  paperWrap.innerHTML='<div class="err"><h2>Comprobante no encontrado</h2><p>El enlace no es válido o ya expiró. Pide al negocio que genere el QR de nuevo.</p></div>';
  tag.textContent='Inválido';tag.className='topbar-tag error';
  btnDl.style.display='none';
}else{
  renderPaper();
  renderRating();
  if(!document.body.classList.contains('preview')){
    generatePNG().then(function(blob){
      if(blob){_blob=blob;triggerDownload(blob);}
      showSuccess();
    });
  }
}

var RATE_URL='https://wwukfbadzhowpvruumrp.supabase.co/functions/v1/submit-rating';
var _stars=0;
function starSvg(){return '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';}
function renderRating(){
  var wrap=$('rateWrap');
  if(!wrap||!d.o) return;                 // sin owner_id no se puede calificar
  var isPreview=document.body.classList.contains('preview');
  wrap.innerHTML='<div class="rate" id="rateCard">'
    +'<h3>¿Cómo fue tu experiencia?</h3>'
    +'<p>Califica el servicio de '+esc(d.s||'la tienda')+'</p>'
    +'<div class="stars" id="stars">'
    +[1,2,3,4,5].map(function(n){return '<div class="star" data-n="'+n+'">'+starSvg()+'</div>';}).join('')
    +'</div>'
    +'<textarea id="rateComment" maxlength="300" placeholder="Cuéntanos algo (opcional)"></textarea>'
    +'<button class="rate-send" id="rateSend">Enviar mi opinión</button>'
    +'</div>';
  requestAnimationFrame(function(){requestAnimationFrame(function(){var c=$('rateCard');if(c)c.classList.add('show');});});
  var stars=$('stars').querySelectorAll('.star');
  function paint(v){for(var i=0;i<stars.length;i++){stars[i].classList.toggle('on',i<v);}}
  for(var i=0;i<stars.length;i++){(function(el){el.addEventListener('click',function(){_stars=Number(el.getAttribute('data-n'));paint(_stars);$('rateSend').classList.add('ready');});})(stars[i]);}
  $('rateSend').addEventListener('click',function(){
    if(_stars<1)return;
    var comment=(($('rateComment')&&$('rateComment').value)||'').slice(0,300);
    var btn=$('rateSend');btn.textContent='Enviando…';btn.classList.remove('ready');
    var done=function(){$('rateCard').innerHTML='<div class="rate-done">¡Gracias por tu opinión! ⭐<span>El negocio recibió tu calificación.</span></div>';};
    if(isPreview){setTimeout(done,300);return;}     // en preview no manda nada
    fetch(RATE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({owner_id:d.o,stars:_stars,comment:comment,folio:d.f})})
      .then(function(r){return r.json();})
      .then(function(){done();})
      .catch(function(){btn.textContent='Reintentar';btn.classList.add('ready');});
  });
}

function qtyLabel(it){
  if(it.u==='kg'){
    var q=Number(it.q||0);
    if(q>=1){return q.toFixed(q%1===0?0:3)+' kg';}
    return Math.round(q*1000)+' g';
  }
  return (it.q)+'×';
}
function priceLabel(it){return it.u==='kg'?('$'+Number(it.p||0).toFixed(2)+'/kg'):('$'+Number(it.p||0).toFixed(2));}

function payLabel(pm){
  if(pm==='efectivo')return 'EFECTIVO';
  if(pm==='credito'||pm==='tarjeta')return 'TARJETA';
  if(pm==='transferencia')return 'TRANSFERENCIA';
  return 'PAGO';
}

function midLabel(it){
  if(it.u==='kg') return qtyLabel(it);
  return Number(it.q)>1 ? (it.q+'×$'+Number(it.p||0).toFixed(0)) : '1×';
}
function renderPaper(){
  var items=Array.isArray(d.i)?d.i:[];
  var itemsHtml=items.map(function(it){
    return '<div class="item"><div class="in">'+esc(it.n)+'</div>'
      +'<div class="iq">'+midLabel(it)+'</div>'
      +'<div class="ip">'+fmt(Number(it.q||0)*Number(it.p||0))+'</div></div>';
  }).join('');

  var subs='<div class="subrow"><span>Subtotal</span><span class="sa">'+fmt(d.st!=null?d.st:d.T)+'</span></div>';
  if(d.x)  subs+='<div class="subrow"><span>IVA</span><span class="sa">'+fmt(d.x)+'</span></div>';
  if(d.ds) subs+='<div class="subrow"><span style="color:#137333">Descuento</span><span class="sa" style="color:#137333">-'+fmt(d.ds)+'</span></div>';
  if(d.tp) subs+='<div class="subrow"><span style="color:#7C3AED">Propina</span><span class="sa" style="color:#7C3AED">'+fmt(d.tp)+'</span></div>';

  var paytag = (d.cr||d.pm==='efectivo')?'':'<div class="paytag">'+payLabel(d.pm)+'</div>';

  var payBlock='';
  if(d.cr){
    payBlock='<div class="fiado"><div class="fiado-title">FIADO · PENDIENTE A PAGAR</div>'
      +(d.cn?'<div class="fiado-sub">Cliente: '+esc(d.cn)+'</div>':'')
      +'<div class="fiado-sub">Conserva esta nota como comprobante de tu adeudo.</div></div>';
  }else if(d.pa!=null){
    payBlock='<div class="paidrow"><span>Pagó con</span><span class="pa">'+fmt(d.pa)+'</span></div>'
      +'<div class="changebox"><span class="cl">CAMBIO</span><span class="ca">'+fmt(d.ca||0)+'</span></div>';
  }

  var wm='';
  if(d.wm){
    for(var i=0;i<14;i++){wm+='<div class="wmline" style="top:'+(24+i*64)+'px">TIKETES · TIKETES · TIKETES · TIKETES</div>';}
    wm='<div class="wmwrap">'+wm+'</div>';
  }

  var thanks = d.cr ? 'Te esperamos para liquidar' : esc(d.fo||'¡Gracias por tu compra!');

  var html='<div class="paper-outer" id="paperOuter"><div class="paper" id="paper">'
    + wm
    + '<div class="content">'
    + (d.slg
        ? '<img class="tlogo" src="'+esc(d.slg)+'"/>'
        : (d.stl===0 ? '' : '<img class="tlogo" src="assets/logo-para-tickets.png"/>'))
    + '<div class="headrow">'
    +   '<div class="storebox">'
    +     '<div class="store">'+esc(d.s||'Tienda')+'</div>'
    +     (d.h?'<div class="slogan">'+esc(d.h)+'</div>':'')
    +     (d.ad?'<div class="addr">'+esc(d.ad)+'</div>':'')
    +     (d.ph?'<div class="addr">Tel: '+esc(d.ph)+'</div>':'')
    +   '</div>'
    +   '<div class="folio"><div class="fl">Venta</div><div class="fn">#'+esc(d.f)+'</div></div>'
    + '</div>'
    + ((d.cn&&!d.cr)?'<div class="cust">Cliente: '+esc(d.cn)+'</div>':'')
    + '<div class="items">'+itemsHtml+'</div>'
    + '<div class="sep"></div>'
    + subs
    + '<div class="totalrow"><span class="tl">TOTAL</span><span class="ta">'+fmt(d.T)+'</span></div>'
    + paytag
    + (payBlock ? '<div class="thinrule"></div>'+payBlock : '')
    + '<div class="foot" style="margin-top:14px">'+esc(d.d)+' · '+esc(d.t)+' · '+items.length+' '+(items.length===1?'producto':'productos')+'</div>'
    + '<div class="thanks">'+thanks+'</div>'
    + (d.so?'<div class="social">'+esc(d.so)+'</div>':'')
    + (d.qj?'<div class="foot" style="margin-top:6px">Quejas y aclaraciones: <strong>'+esc(d.qj)+'</strong></div>':'')
    + (d.lg?'<div class="legal">'+esc(d.lg).replace(/\n/g,'<br/>')+'</div>':'')
    + (d.fr?'<div class="foot" style="margin-top:8px">Hecho con Tiketes · tiketes.com.mx</div>':'')
    + (d.wm?'<div class="brand">VÍA TIKETES</div>':'')
    + '</div></div></div>';

  paperWrap.innerHTML=html;
  requestAnimationFrame(function(){requestAnimationFrame(function(){$('paperOuter').classList.add('show');});});
}

function generatePNG(){
  return new Promise(function(resolve){
    if(typeof html2canvas!=='function'){resolve(null);return;}
    var el=$('paper');
    if(!el){resolve(null);return;}
    html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true}).then(function(canvas){
      canvas.toBlob(function(b){resolve(b);},'image/png');
    }).catch(function(){resolve(null);});
  });
}

var _blob=null;
function triggerDownload(blob){
  var store=(d.s||'Tiketes').replace(/[^\wÀ-ɏ]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  var fname='Ticket-'+store+'-'+d.f+'.png';
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);document.body.removeChild(a);},4000);
}
function downloadNow(){
  if(_blob){triggerDownload(_blob);}
  else{
    generatePNG().then(function(b){
      if(b){_blob=b;triggerDownload(b);}
      else{alert('Para guardar tu ticket, toma una captura de pantalla.');}
    });
  }
}

function showSuccess(){
  tag.textContent='Listo ✓';tag.className='topbar-tag ready';
  statusEl.classList.add('show');
  btnDl.classList.add('show');
  if(!_blob){$('btnLabel').textContent='Toma captura de pantalla';}
}
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "3535288e08fe4b08ac9c4b4633385ee7"}'></script>
</body>
</html>
